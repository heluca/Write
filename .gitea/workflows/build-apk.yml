name: Build signed release

# Signed release artifacts for Eidolon (ca.helu.eidolon), built on Gitea so the
# heluca-upload keystore never leaves Heluca infra. GitHub (heluca/Write) stays
# the free public CI + PR-to-upstream path and emits an UNSIGNED apk; this job is
# the signing path. Source is mirrored here from GitHub — see the repo README.
# Emits BOTH outputs from one native build: the .aab for Play Console upload
# (required for new apps) and the .apk for adb sideloading onto test devices.
#
# Differs from the r/android template (templates/build.yml) because Write is not a
# stock Gradle app:
#   * git submodules (SDL, ulib, pugixml, ...) — SDL must sit on write-android, and
#     the Heluca forks (heluca/SDL, heluca/ulib) live on PUBLIC GitHub, so the
#     container clones them without GitHub auth; only this top-level repo is private.
#   * ndk-build + a committed static curl/mbedTLS prebuilt set. Everything is built
#     with NDK r27.0.12077973 — the image's baked NDK — including the prebuilts
#     (regenerate with build-curl.sh when bumping) and the SDL ALooper fix on
#     heluca/SDL write-android. No job-time NDK download.
#   * gradlew lives at syncscribble/android/, not the repo root.
#
# Signing is injected at job time via -Pandroid.injected.signing.* (Heluca
# convention, no signingConfig in build.gradle). Without the keystore secret the
# build would still succeed but emit an unsigned apk — the secrets below make it
# signed.

on:
  push:
    branches: [ master, webdav ]
  workflow_dispatch:

jobs:
  build:
    # amd64: the toolchain image carries x86_64 Android build-tools (Google ships
    # no arm64 Linux build-tools), so it runs on an amd64 runner.
    runs-on: ubuntu-24.04
    container:
      # Immutable tag (r/android git tag -> CI-built image). Bump deliberately;
      # never :latest here. The baked NDK r27 is used directly (app pins the
      # same version).
      image: git.helu.ca/r/android:2026.07
      credentials:
        username: ${{ gitea.actor }}
        password: ${{ secrets.PACKAGE_TOKEN }}
    steps:
      # Explicit clone (not actions/checkout) to recurse submodules the same way the
      # GitHub CI does. The top-level repo is private, so authenticate with the
      # built-in token; submodules resolve from public GitHub with no auth.
      - name: Checkout (this repo + submodules)
        run: |
          git clone --recurse-submodules \
            "https://${{ gitea.actor }}:${{ secrets.GITEA_TOKEN }}@git.helu.ca/${{ gitea.repository }}.git" \
            --branch "${{ gitea.ref_name }}" Write

      # -C creates the branch name at the PINNED submodule commit (satisfies the
      # Makefile's branch gate) instead of chasing the remote branch tip — CI builds
      # exactly the SDL the superproject pins.
      - name: SDL to write-android branch
        working-directory: Write/SDL
        run: git switch -C write-android

      - name: Decode keystore
        run: echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/heluca-upload.jks"

      # Signed via -Pandroid.injected.signing.* (no signingConfig in build.gradle).
      # UPLOAD_* names match r/dade: the publisher-wide heluca-upload key. The alias
      # is the fixed convention string, not a secret. bundleRelease + assembleRelease
      # share the native build, so the second output is nearly free.
      - name: Build signed release bundle + APK
        working-directory: Write/syncscribble/android
        run: |
          ./gradlew --no-daemon bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/heluca-upload.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="heluca-upload" \
            -Pandroid.injected.signing.key.password="${{ secrets.UPLOAD_KEY_PASSWORD }}"

      # Injected signing produces app-release.{aab,apk} (no -unsigned suffix) —
      # a generic name that says nothing about which app or which version you are
      # holding once the artifact zip has been downloaded and unpacked. Rename on
      # the way into out/, using the versionName from the app's build.gradle:
      # eidolon-release-<version>.{aab,apk}, matching r/dade's convention.
      #
      # Done here rather than via archivesBaseName so the change stays in Heluca's
      # CI and out of the mirrored upstream Write source.
      - name: Collect artifacts
        run: |
          GRADLE_APP=Write/syncscribble/android/app
          VERSION=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' "$GRADLE_APP/build.gradle" | head -1)
          [ -n "$VERSION" ] || { echo "could not read versionName from $GRADLE_APP/build.gradle"; exit 1; }
          echo "versionName: $VERSION"
          mkdir -p out
          find "$GRADLE_APP/build/outputs/bundle/release" -name "*.aab" \
            -exec cp {} "out/eidolon-release-$VERSION.aab" \;
          find "$GRADLE_APP/build/outputs/apk/release" -name "*.apk" \
            -exec cp {} "out/eidolon-release-$VERSION.apk" \;
          ls -l out

      # Pinned to v3: upload-artifact@v4 requires a backend Gitea Actions does not
      # implement and fails with "not supported on GHES".
      - name: Upload Play bundle (.aab)
        uses: actions/upload-artifact@v3
        with:
          name: eidolon-release-aab
          path: out/*.aab
          if-no-files-found: error

      - name: Upload sideload APK
        uses: actions/upload-artifact@v3
        with:
          name: eidolon-release-apk
          path: out/*.apk
          if-no-files-found: error
