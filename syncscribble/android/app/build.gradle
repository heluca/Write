apply plugin: 'com.android.application'
//apply plugin: 'com.android.library'

android {
    compileSdkVersion 30
    namespace 'ca.helu.eidolon'
    defaultConfig {
        applicationId "ca.helu.eidolon"
        // Heluca convention: versionCode = MAJOR*10000 + MINOR*100 + PATCH
        // (fresh applicationId — versioning independent of upstream Write's)
        versionCode 1
        versionName "0.0.1"
        // SDK 18 for GLES 3.0 (linking fails for ES3.1 fns for armv7), SDK 21 for GLES 3.1
        minSdkVersion 21
        targetSdkVersion 29
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-21", "V=1"
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }
    }
    buildTypes {
        release {
            // no signingConfig: signing is injected at build time via
            // -Pandroid.injected.signing.* (Heluca r/android convention)
            minifyEnabled false
            // to add release specific compiler flags, add cFlags or cppFlags here
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
                // embed native symbol tables in the .aab so Play can symbolize crashes
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
        arm64rel {
            //initWith(buildTypes.release)
            signingConfig signingConfigs.debug
            minifyEnabled false
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        x86rel {
            signingConfig signingConfigs.debug
            minifyEnabled false
            ndk {
                abiFilters 'x86'
            }
        }
    }

    sourceSets.main {
        jniLibs.srcDir 'libs'
    }
    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }
    // NDK r26.3: the committed static curl+mbedTLS prebuilts (android/prebuilt/) are built
    // against this; SDL on write-android compiles cleanly here (r27 needs the ALooper fix)
    ndkVersion '26.3.11579264'


    lintOptions {
        // google suddenly decided I needed to download intellij, kotlin, groovy, play-sdk, etc. to build a simple APK
        checkReleaseBuilds false
        abortOnError false
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support:support-v4:28.0.0'
}
