apply plugin: 'com.android.application'
//apply plugin: 'com.android.library'

android {
    // 36: the only platform baked into the r/android image (avoids a job-time download)
    compileSdkVersion 36
    namespace 'ca.helu.eidolon'
    defaultConfig {
        applicationId "ca.helu.eidolon"
        // Heluca convention: versionCode = MAJOR*10000 + MINOR*100 + PATCH
        // (fresh applicationId — versioning independent of upstream Write's)
        versionCode 1
        versionName "0.0.1"
        // SDK 18 for GLES 3.0 (linking fails for ES3.1 fns for armv7), SDK 21 for GLES 3.1
        minSdkVersion 21
        targetSdkVersion 36   // Play floor from Aug 31 2026; storage is scoped-storage-only
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-21", "V=1"
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }
    }
    buildTypes {
        release {
            // no signingConfig: signing is injected at build time via
            // -Pandroid.injected.signing.* (Heluca r/android convention)
            minifyEnabled false
            // to add release specific compiler flags, add cFlags or cppFlags here
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
                // embed native symbol tables in the .aab so Play can symbolize crashes
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
        arm64rel {
            //initWith(buildTypes.release)
            signingConfig signingConfigs.debug
            minifyEnabled false
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        x86rel {
            signingConfig signingConfigs.debug
            minifyEnabled false
            ndk {
                abiFilters 'x86'
            }
        }
    }

    sourceSets.main {
        jniLibs.srcDir 'libs'
    }
    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }
    // matches the r/android toolchain image's baked NDK. The committed curl+mbedTLS
    // prebuilts (android/prebuilt/, regenerate via build-curl.sh) and the SDL ALooper
    // fix on heluca/SDL write-android are both built for r27.
    ndkVersion '27.0.12077973'


    lintOptions {
        // google suddenly decided I needed to download intellij, kotlin, groovy, play-sdk, etc. to build a simple APK
        checkReleaseBuilds false
        abortOnError false
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support:support-v4:28.0.0'
}
